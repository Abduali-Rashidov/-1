<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
<title>№1 практика</title>
  <style>
  body {
    background-color: #f0f4f8;
    font-family: Arial, sans-serif;
    padding: 30px;
    text-align: center;
  }

  h1 {
    color: #1d4ed8;
  }

  p {
    color: #166534;
    font-size: 20px;
  }

  button {
    background-color: #2563eb;
    color: white;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
button:hover {
  background-color: #1d4ed8;
}
  input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
    .card {
  background-color: white;
  max-width: 500px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>
  <div class="card">
  <h1>
    Сәлем! Менің парақшама қош келдің!
  </h1>

  <p>
    Мен веб-сайт жасауды үйреніп жүрмін.
  </p>

  <input id="name" placeholder="Атыңды жаз">
  <button onclick="greet()">Сәлемдесу</button>

  <h2 id="title">Бұл — менің алғашқы сайтым!</h2>
  <button onclick="changeText()">Тақырыпты өзгерту</button>

  <script>
    function greet() {
      const name = document.getElementById("name").value;
      alert("Сәлем, " + name + "!");
    }

    function changeText() {
      document.getElementById("title").textContent =
        "Мен сайт жасауды үйреніп жүрмін!";
    }
  </script>
    </div>
</body>
</html>
